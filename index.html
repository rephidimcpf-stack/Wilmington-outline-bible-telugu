<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8e3418">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Outlines">
<link id="manifestlink" rel="manifest">
<link id="touchicon" rel="apple-touch-icon">
<title>Outline Bible — Willmington's Chapter Outlines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suranna&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Serif+Telugu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e6; --surface:#fffdf8; --surface2:#f1e9d8; --border:#e3d7bf; --border2:#cdbd9c;
  --text:#3a2f22; --dim:#87765f; --accent:#8e3418; --accent2:#b98a1e; --accent-dim:#f3e2c8;
  --gold:#9c7417; --link:#8e3418; --shadow:0 2px 10px rgba(90,60,20,.12);
  --font-head:'Suranna', 'Noto Sans Telugu', serif;
  --font-body:'Cormorant Garamond', 'Noto Serif Telugu', Georgia, serif;
  --font-ui:'Noto Sans Telugu', 'Segoe UI', system-ui, sans-serif;
  --fs:17.5px;
}
[data-theme="dark"]{
  --bg:#1d1811; --surface:#29221a; --surface2:#332a1e; --border:#443727; --border2:#5c4a33;
  --text:#ece2cf; --dim:#a08d72; --accent:#e0a56e; --accent2:#c9971e; --accent-dim:#4a341f;
  --gold:#c9971e; --link:#e0a56e; --shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:var(--fs); line-height:1.75; overscroll-behavior:none; transition:background .25s, color .25s}
button{font-family:var(--font-ui); cursor:pointer}
#loader{position:fixed; inset:0; background:var(--bg); z-index:300; display:flex; flex-direction:column; gap:14px; align-items:center; justify-content:center; font-family:var(--font-ui); color:var(--dim)}
#loader .sp{width:38px; height:38px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--accent); animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
header{position:sticky; top:0; z-index:60; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px;
  padding:9px 14px; padding-top:calc(9px + env(safe-area-inset-top, 0px));
  background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(9px); border-bottom:1px solid var(--border)}
.brand{font-family:var(--font-head); font-size:21px; color:var(--accent); letter-spacing:.3px; display:flex; align-items:baseline; cursor:pointer}
.brand small{font-family:var(--font-ui); font-size:10.5px; color:var(--dim); letter-spacing:.8px; text-transform:uppercase; margin-left:9px}
.hbtn{background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:9px; padding:7px 12px; font-size:13.5px; display:inline-flex; align-items:center; gap:6px; box-shadow:var(--shadow); transition:all .15s}
.hbtn:hover{border-color:var(--accent)}
.hbtn svg{display:block}
main{max-width:880px; margin:0 auto; padding:16px 14px 90px}
/* ---------- home ---------- */
.tghead{width:100%; display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:13px 15px; margin:16px 0 9px; cursor:pointer; box-shadow:var(--shadow); font-family:var(--font-ui); transition:all .15s}
.tghead:hover{border-color:var(--accent)}
.tghead .tgl{font-family:var(--font-head); font-size:16.5px; color:var(--accent); letter-spacing:.4px}
.tghead .tgn{font-family:var(--font-ui); font-size:11px; color:var(--dim)}
.tghead .tgc{margin-left:auto; color:var(--dim); font-size:11px; transition:transform .18s; flex:none}
.tghead.open .tgc{transform:rotate(180deg)}
.blrow{width:100%; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:11px 15px; margin:0 0 7px; cursor:pointer; text-align:left; transition:all .15s; box-shadow:var(--shadow)}
.blrow:hover{border-color:var(--accent); transform:translateY(-1px)}
.blrow .blt{font-family:var(--font-ui); font-weight:600; font-size:14.5px; color:var(--text); line-height:1.5}
.blrow .ble{font-family:var(--font-ui); font-size:11.5px; color:var(--gold); line-height:1.5}
.blrow .blm{margin-left:auto; font-family:var(--font-ui); font-size:10.5px; color:var(--dim); text-align:right; flex:none}
/* ---------- book view ---------- */
#bkhead{margin:10px 0 6px}
#bkt{font-family:var(--font-head); font-size:29px; color:var(--accent); line-height:1.25; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
#bkt .te{font-family:var(--font-ui); font-size:16px; color:var(--gold); font-weight:400}
#bkt .te::before{content:'·'; margin-right:10px; color:var(--dim); font-size:14px}
#bksub{font-family:var(--font-ui); font-size:12px; color:var(--dim); margin-top:3px}
#chrow{display:flex; gap:6px; overflow-x:auto; padding:10px 2px 12px; scrollbar-width:thin; flex-wrap:wrap}
.chchip{flex:none; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:4px 9px; font-size:12.5px; color:var(--text); font-family:var(--font-ui)}
.chchip:hover{border-color:var(--accent)}
.chchip.sel{background:var(--accent); border-color:var(--accent); color:#fff8ec}
.chlab{font-family:var(--font-ui); font-size:10.5px; color:var(--dim); align-self:center; letter-spacing:1px; text-transform:uppercase; flex:none}
.xnote{font-family:var(--font-ui); font-size:12px; color:var(--gold); background:var(--surface); border:1px dashed var(--border2); border-radius:11px; padding:10px 12px; margin:0 0 12px; line-height:1.7}
.part{background:linear-gradient(135deg, var(--accent-dim), var(--surface)); border:1px solid var(--border2); border-radius:13px; padding:12px 15px; margin:16px 0 10px}
.part .pt{font-family:var(--font-ui); font-weight:600; font-size:13px; color:var(--accent); letter-spacing:.4px}
.part .pd{font-family:var(--font-body); font-size:15.5px; color:var(--text); margin-top:5px; line-height:1.65}
.sec{background:var(--surface); border:1px solid var(--border); border-radius:14px; margin:10px 0; box-shadow:var(--shadow); overflow:hidden}
.sech{display:block; padding:11px 13px; cursor:pointer; user-select:none}
.sech:hover{background:var(--surface2)}
.secline{display:flex; align-items:center; gap:10px}
.sech .orn{font-family:var(--font-head); font-size:13px; color:var(--gold); flex:none; letter-spacing:.5px; min-width:64px}
.sech .rng{font-family:var(--font-ui); font-weight:600; font-size:13px; color:var(--accent); flex:1; min-width:0; line-height:1.6}
.sech .sum{font-family:var(--font-body); font-style:italic; font-size:14px; color:var(--dim); margin-top:6px; line-height:1.75}
.sech .car{color:var(--dim); font-size:11px; transition:transform .18s; flex:none}
.sec.closed .car{transform:rotate(-90deg)}
.sec.closed .sum{display:none}
.sec.closed .sech{border-bottom:none}
.secb{display:block; padding:4px 18px 14px 14px; border-top:1px solid var(--border)}
.sec.closed .secb{display:none}
.bmark{font-family:var(--font-ui); font-size:12px; color:var(--gold); background:var(--accent-dim); border-radius:7px; padding:1px 7px; flex:none}
.itm{display:flex; gap:8px; margin:7px 0; line-height:1.62}
.itm .mk{font-family:var(--font-ui); font-weight:600; font-size:12px; color:var(--gold); flex:none; padding-top:2px; min-width:26px; text-align:right}
.itm .tx{flex:1; font-size:16.5px}
.itm .tx b{font-family:var(--font-ui); font-size:13px; font-weight:600; color:var(--accent)}
.l0{margin-left:0}.l1{margin-left:22px}.l2{margin-left:44px}.l3{margin-left:66px}.l4{margin-left:88px}
.l1 .mk{color:var(--accent)}.l2 .mk{color:var(--dim)}.l3 .mk{color:var(--dim)}
/* ---------- edit mode ---------- */
.ebtn{background:none; border:none; color:var(--dim); font-size:13.5px; padding:5px 6px; border-radius:8px; flex:none; cursor:pointer; line-height:1; transition:all .12s}
.ebtn:hover{background:var(--surface2); color:var(--accent)}
.sec.hasedits .ebtn{color:var(--accent)}
.sec.hasedits .sech .orn::after{content:'✎'; font-size:10px; margin-left:5px; color:var(--accent); vertical-align:1px}
.itm.edited .tx{border-bottom:1px dotted var(--gold)}
.editbox{padding:8px 10px 12px}
.erow{margin:9px 0}
.erow label{font-family:var(--font-ui); font-size:10.5px; font-weight:600; color:var(--gold); display:block; margin-bottom:3px; letter-spacing:.4px}
.erow textarea{width:100%; box-sizing:border-box; background:var(--bg); border:1.5px solid var(--border2); border-radius:9px; padding:9px 11px 10px; font-family:var(--font-body); font-size:15.5px; color:var(--text); outline:none; resize:vertical; min-height:56px; line-height:2.2}
.erow textarea:focus{border-color:var(--accent)}
.ebar{display:flex; gap:8px; justify-content:flex-end; margin-top:12px; flex-wrap:wrap; align-items:center}
.ebar .ereset{margin-right:auto}
.emeta{font-family:var(--font-ui); font-size:10.5px; color:var(--dim); margin:2px 0 0}
#editcount{margin-left:auto; color:var(--gold); font-size:10.5px}
.attn{font-family:var(--font-ui); font-size:11px; color:var(--dim); text-align:center; margin:34px 10px 0; line-height:1.8}
.backrow{display:flex; justify-content:space-between; align-items:center; margin-top:4px}
.backbtn{background:none; border:none; color:var(--accent); font-size:13px; font-family:var(--font-ui); padding:6px 2px}
.backbtn:hover{text-decoration:underline}
/* ---------- search ---------- */
#sbar{position:fixed; inset:0; top:0; background:color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter:blur(8px); z-index:120; display:none; flex-direction:column; padding:14px; padding-top:calc(14px + env(safe-area-inset-top, 0px))}
#sbar.on{display:flex}
#srow{display:flex; gap:8px}
#sq{flex:1; background:var(--surface); border:1.5px solid var(--border2); border-radius:11px; padding:11px 14px; font-family:var(--font-ui); font-size:15px; color:var(--text); outline:none}
#sq:focus{border-color:var(--accent)}
#sres{overflow-y:auto; margin-top:10px; flex:1}
.sr{background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:10px 13px; margin-bottom:8px; cursor:pointer}
.sr:hover{border-color:var(--accent)}
.sr .srt{font-family:var(--font-ui); font-weight:600; font-size:12.5px; color:var(--accent)}
.sr .srx{font-family:var(--font-body); font-size:14.5px; color:var(--text); margin-top:3px; line-height:1.55}
.sr .srx mark{background:var(--accent-dim); color:var(--accent); border-radius:3px; padding:0 2px}
.sempty{font-family:var(--font-ui); color:var(--dim); font-size:13.5px; text-align:center; padding:30px 10px}
/* ---------- menu ---------- */
#menu{position:fixed; top:52px; right:12px; background:var(--surface); border:1px solid var(--border); border-radius:13px; box-shadow:0 10px 34px rgba(60,40,20,.3); min-width:250px; z-index:99; padding:6px; display:none}
#menu.on{display:block}
#menu button{display:flex; align-items:center; gap:10px; width:100%; background:none; border:none; text-align:left; padding:9.5px 11px; font-size:13.5px; color:var(--text); border-radius:9px}
#menu button:hover{background:var(--surface2)}
#menu button small{margin-left:auto; color:var(--dim); font-size:10.5px}
#menu hr{border:none; border-top:1px solid var(--border); margin:5px 8px}
#mver{font-family:var(--font-ui); font-size:10.5px; color:var(--dim); text-align:center; padding:7px 8px 4px; margin-top:4px; border-top:1px solid var(--border); letter-spacing:.6px}
/* ---------- toast ---------- */
#toast{position:fixed; bottom:18px; left:50%; transform:translateX(-50%) translateY(8px); background:var(--surface); color:var(--text); border:1px solid var(--border2); border-radius:11px; padding:10px 18px; font-family:var(--font-ui); font-size:13px; box-shadow:0 8px 26px rgba(50,30,10,.35); opacity:0; visibility:hidden; transition:all .25s; z-index:400; max-width:86vw; text-align:center}
#toast.on{opacity:1; visibility:visible; transform:translateX(-50%) translateY(0)}
/* ---------- install dialog ---------- */
.dlg{position:fixed; inset:0; background:rgba(30,20,10,.55); z-index:170; display:none; align-items:center; justify-content:center; padding:18px}
.dlg.on{display:flex}
.dlgbox{background:var(--surface); border:1px solid var(--border2); border-radius:16px; padding:20px; width:min(440px, 94vw); max-height:88vh; overflow-y:auto; box-shadow:0 18px 60px rgba(40,20,5,.5)}
.dlgtitle{font-family:var(--font-head); font-size:19px; color:var(--accent); margin-bottom:10px}
.dlgrow{display:flex; gap:9px; justify-content:flex-end; margin-top:14px}
.dbtn{background:var(--surface2); border:1px solid var(--border2); color:var(--text); border-radius:10px; padding:9px 17px; font-size:13.5px}
.dbtn.primary{background:var(--accent); border-color:var(--accent); color:#fff8ec}
.dbtn.primary:hover{filter:brightness(1.08)}
.ihint{font-family:var(--font-ui); font-size:11.5px; color:var(--dim); margin:8px 0 2px; line-height:1.7}
#iconpick{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin:4px 0 12px}
.icard{display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 4px 8px; border:1.5px solid var(--border); border-radius:13px; background:var(--bg); transition:all .12s}
.icard img{width:52px; height:52px; border-radius:12px; box-shadow:0 1px 3px rgba(60,40,20,.25)}
.icard span{font-family:var(--font-ui); font-size:10.5px; color:var(--dim); text-align:center; line-height:1.35}
.icard:hover{border-color:var(--border2)}
.icard.sel{border-color:var(--accent); background:var(--accent-dim); box-shadow:inset 0 0 0 1.5px var(--accent)}
.icard.sel span{color:var(--accent); font-weight:600}
.istep{font-family:var(--font-ui); font-size:13.5px; line-height:1.95; color:var(--text); padding:1px 0}
.istep b{color:var(--accent)}
@media (max-width:480px){ #iconpick{grid-template-columns:repeat(2, 1fr)} #bkt{font-size:24px} .sech .orn{min-width:40px} }
@media print{
  header,#chrow,.backrow,#menu,#sbar,#toast,.ebtn,#loader,#home{display:none!important}
  :root, html[data-theme="dark"]{
    --bg:#fff; --surface:#fff; --surface2:#f6f6f6; --border:#c8c8c8; --border2:#b0b0b0;
    --text:#1c1c1c; --dim:#4a4a4a; --accent:#7a2e14; --gold:#7a5c0e; --accent-dim:#fff;
    --shadow:none;
  }
  body{background:#fff; color:#1c1c1c}
  main{max-width:100%; padding:0 4px}
  *{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  .sec{box-shadow:none; border:1px solid #b8b8b8; break-inside:avoid; margin:10px 0}
  .sec.closed .secb{display:block}
  .sec.closed .sum{display:block}
  .sech{cursor:default}
  .sech .sum{font-size:13px; line-height:1.6}
  .secb{padding:4px 14px 10px 10px}
  .itm{line-height:1.75; margin:6px 0}
  .itm .tx{font-size:13.5px}
  .part{background:#fff; border:1px solid #b8b8b8; box-shadow:none; break-inside:avoid}
  .xnote{background:#fff; border:1px dashed #b0b0b0}
  #bkhead{margin:4px 0 8px}
  #bkt{font-size:22px}
}
</style>
</head>
<body>
<div id="loader"><div class="sp"></div><div>Loading Willmington's outlines…</div></div>

<header>
  <div class="brand" id="brand">Outline Bible <small>Willmington's Chapter Outlines</small></div>
  <button class="hbtn" id="searchbtn" title="Search the outlines">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Search</button>
  <button class="hbtn" id="themebtn" title="Toggle dark mode">◐</button>
  <button class="hbtn" id="menubtn" title="Menu">⋮</button>
</header>

<main>
  <div id="home"></div>
  <div id="book" style="display:none"></div>
</main>

<div id="sbar">
  <div id="srow">
    <input id="sq" placeholder="Search all outlines — e.g. 'నౌక', 'హవ్వ', 'పునరుత్థానము'…" autocomplete="off">
    <button class="hbtn" id="sclose">✕</button>
  </div>
  <div id="sres"></div>
</div>

<div id="menu">
  <button id="m-install"><span>📲</span> Install on phone… <small>choose icon</small></button>
  <button id="m-print"><span>🖨</span> Print this book <small>.pdf</small></button>
  <hr>
  <button id="m-backup"><span>💾</span> Backup edits… <small id="editcount">no edits yet</small></button>
  <button id="m-restore"><span>📂</span> Restore edits… <small>choose file</small></button>
  <button id="m-clear"><span>🗑</span> Clear all edits…</button>
  <hr>
  <button id="m-about"><span>ℹ</span> About & credits</button>
  <div id="mver">Outline Bible · v3</div>
</div>

<div class="dlg" id="idlg"><div class="dlgbox">
  <div class="dlgtitle">Install on your phone</div>
  <div class="ihint">Choose the app icon — this is the icon that will appear on your home screen:</div>
  <div id="iconpick"></div>
  <div id="insteps"></div>
  <div class="dlgrow"><button class="dbtn" id="idlgcancel">Close</button><button class="dbtn primary" id="ibtn">Install now</button></div>
</div></div>

<div id="toast"></div>

<div class="dlg" id="rdlg"><div class="dlgbox">
  <div class="dlgtitle">Restore edits</div>
  <div class="ihint" id="rdlginfo"></div>
  <div class="dlgrow"><button class="dbtn" id="rdlgcancel">Cancel</button><button class="dbtn" id="rdlgmerge">Merge</button><button class="dbtn primary" id="rdlgreplace">Replace all</button></div>
</div></div>

<div class="dlg" id="cdlg"><div class="dlgbox">
  <div class="dlgtitle">Clear all edits?</div>
  <div class="ihint" id="cdlginfo"></div>
  <div class="dlgrow"><button class="dbtn" id="cdlgcancel">Keep my edits</button><button class="dbtn primary" id="cdlgok">Clear everything</button></div>

<script>
'use strict';
/* ================= data ================= */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
let D = null;
let SETTINGS = { theme:'', icon:'scroll' };
let toastT = null;
function toast(msg){
  const t = $('#toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove('on'), 2600);
  t.onclick = () => t.classList.remove('on');
}
function saveSettings(){ try{ localStorage.setItem('ob.settings', JSON.stringify(SETTINGS)); }catch(e){} }
function loadSettings(){ try{ Object.assign(SETTINGS, JSON.parse(localStorage.getItem('ob.settings') || '{}')); }catch(e){} }

/* ================= user edits ================= */
let EDITS = {};
function saveEdits(){ try{ localStorage.setItem('ob.edits', JSON.stringify(EDITS)); }catch(e){} }
function loadEdits(){ try{ const v = JSON.parse(localStorage.getItem('ob.edits') || '{}'); if (v && typeof v === 'object') EDITS = v; }catch(e){} }
function editKey(sec, k){ return sec._ok + '/' + sec._si + '/' + k; }
function editVal(sec, k, orig){ const v = EDITS[editKey(sec, k)]; return v === undefined ? orig : v; }
function sectionEdited(sec){ const p = sec._ok + '/' + sec._si + '/'; return Object.keys(EDITS).some(x => x.indexOf(p) === 0); }
function updateEditCount(){
  const n = Object.keys(EDITS).length;
  const el = $('#editcount');
  if (el) el.textContent = n ? n + (n === 1 ? ' edit' : ' edits') : 'no edits yet';
}

async function loadData(){
  const b64 = $('#appdata').textContent.trim();
  const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const ds = new DecompressionStream('gzip');
  const stream = new Blob([bin]).stream().pipeThrough(ds);
  const text = await (new Response(stream)).text();
  D = JSON.parse(text);
}

/* ================= icons (canvas) ================= */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
function rr(g, x, y, w, h, r){
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function iconBg(g, s, c1, c2){
  const gr = g.createLinearGradient(0, 0, s, s);
  gr.addColorStop(0, c1); gr.addColorStop(1, c2);
  g.fillStyle = gr; g.fillRect(0, 0, s, s);

function iconDataURL(id, size){
  try{
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    if (!g) throw new Error('no canvas');
    ICON_DRAW[id](g, size);
    const url = c.toDataURL('image/png');
    if (!url || url.indexOf('image/png') < 0) throw new Error('no png');
    return { url:url, type:'image/png', sizes:size + 'x' + size };
  }catch(e){
    return { url:'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(ICON_SVG[id]), type:'image/svg+xml', sizes:'any' };
  }
}
function b64ascii(str){
  try{ return btoa(unescape(encodeURIComponent(str))); }catch(e){ return ''; }
}
function applyIcon(id){

function prettyOrd(n){
  return String(n).toLowerCase().split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
function bookIndex(os){ return D.books.findIndex(b => b.os === os); }

function mkLevel(k){
  if (/^[IVX]+\.$/.test(k)) return 0;
  if (/^[A-Z]\.$/.test(k)) return 1;
  if (/^\d+\.$/.test(k)) return 2;
  if (/^[a-z]\.$/.test(k)) return 3;
  return 4;
}
function esc(t){ return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function secCard(sec, opts){
  const lv = opts && opts.linked ? ' (' + esc(opts.linked) + ' నుండి)' : '';
  let items = '';
  for (let i = 0; i < sec.b.length; i++){
    const it = sec.b[i];
    const lvl = mkLevel(it.k);
    const cur = editVal(sec, i, it.t);
    items += '<div class="itm l' + lvl + (cur === it.t ? '' : ' edited') + '"><span class="mk">' + esc(it.k) + '</span><span class="tx">' + esc(cur) + '</span></div>';
  }
  const sumNow = sec.sum ? editVal(sec, 'sum', sec.sum) : '';
  return '<div class="sec' + ((opts && opts.closed) ? ' closed' : '') + (sectionEdited(sec) ? ' hasedits' : '') + '" data-ok="' + esc(sec._ok) + '" data-si="' + sec._si + '">' +
    '<div class="sech"><div class="secline"><span class="orn">§ ' + prettyOrd(sec.n) + '</span><span class="rng">' + esc(sec.rng) + lv + '</span>' +
    '<button class="ebtn" title="Edit this section">✎</button><span class="car">▾</span></div>' +
    '<div class="sum">' + esc(sumNow) + '</div></div>' +
    '<div class="secb">' + items + '</div></div>';
}

function sectionsForChapter(bi, ch){
  const bk = D.books[bi];
  const own = bk.secs.filter(s => s.ch.includes(ch));
  const cross = [];
  D.books.forEach((ob, oi) => {
    if (oi === bi) return;
    ob.secs.forEach(s => {
      if (s.xb && s.xb[bk.os] && s.xb[bk.os].includes(ch)) cross.push({ s, from: ob.te });
    });
  });
  return { own, cross };
}

      const k = ta.dataset.k;
      const idx = (k === 'sum') ? 'sum' : +k;
      const orig = (k === 'sum') ? sec.sum : sec.b[+k].t;
      const val = ta.value.replace(/^\s+|\s+$/g, '');
      const key = editKey(sec, idx);
      if (val === orig){ if (EDITS[key] !== undefined){ delete EDITS[key]; n++; } }
      else if (EDITS[key] !== val){ EDITS[key] = val; n++; }
    });
    saveEdits(); refreshView(); updateEditCount();
    toast(n ? 'Changes saved' : 'No changes to save');
  });
  const first = body.querySelector('textarea');
  if (first) setTimeout(() => { first.focus(); first.setSelectionRange(first.value.length, first.value.length); }, 60);
}

function refreshView(){
  const y = window.scrollY;
  if (VIEW.book >= 0){ openBook(VIEW.book, VIEW.chapter); window.scrollTo(0, y); }
  else renderHome();
}

/* ================= backup & restore ================= */
function backupPayload(){
  return JSON.stringify({ app:'outline-bible', book:'te', version:2, saved:new Date().toISOString(), count:Object.keys(EDITS).length, edits:EDITS }, null, 1);
}

async function backupEdits(){
  const n = Object.keys(EDITS).length;
  if (!n){ toast('No edits yet — tap ✎ on a section to edit it first'); return; }
  const payload = backupPayload();
  const name = 'outline-bible-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  try{
    if (window.showSaveFilePicker){
      const h = await window.showSaveFilePicker({ suggestedName:name, types:[{ description:'Outline Bible backup', accept:{ 'application/json':['.json'] } }] });
      const w = await h.createWritable(); await w.write(payload); await w.close();
      toast('Backup saved to your chosen location');
      return;
    }
  }catch(e){ if (e && e.name === 'AbortError') return; }
  try{
    const url = URL.createObjectURL(new Blob([payload], { type:'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Backup file downloading — move it anywhere you like');
  }catch(err){ toast('Could not create the backup file'); }
}

let PENDING = null;
async function restoreEdits(){
  try{
    if (window.showOpenFilePicker){
      const [h] = await window.showOpenFilePicker({ types:[{ description:'Outline Bible backup', accept:{ 'application/json':['.json'] } }] });
      handleRestoreFile(await h.getFile());
      return;
    }
  }catch(e){ if (e && e.name === 'AbortError') return; }
  $('#rfile').click();
}

function readAsText(f){
  if (f.text) return f.text();
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsText(f); });
}

async function handleRestoreFile(f){
  let data;
  try{ data = JSON.parse(await readAsText(f)); }catch(e){ toast('That file is not a valid backup'); return; }
  if (!data || (data.app !== 'outline-bible' && data.app !== 'outline-bible-te') || !data.edits || typeof data.edits !== 'object'){
    toast('That file is not an Outline Bible backup'); return;
  }
  PENDING = data.edits;
  const n = Object.keys(PENDING).length;
  const cur = Object.keys(EDITS).length;
  $('#rdlginfo').innerHTML = 'Found <b>' + n + '</b> saved edit' + (n === 1 ? '' : 's') + ' in <i>' + esc(f.name) + '</i>.' +
    (cur ? '<br>You currently have <b>' + cur + '</b> edit' + (cur === 1 ? '' : 's') + ' on this device.' : '') +
    '<br><b>Replace all</b> discards current edits and uses the file. <b>Merge</b> keeps both, file wins on conflicts.';
  $('#rdlg').classList.add('on');
}

function applyPending(mode){
  if (!PENDING) return;
  if (mode === 'replace') EDITS = Object.assign({}, PENDING);
  else Object.assign(EDITS, PENDING);
  PENDING = null;
  saveEdits(); updateEditCount(); refreshView();
  toast('Restored ' + Object.keys(EDITS).length + ' edit' + (Object.keys(EDITS).length === 1 ? '' : 's'));
}

/* ================= search ================= */
function runSearch(q){
  q = q.trim().toLowerCase();
  const res = $('#sres');
  if (q.length < 3){ res.innerHTML = '<div class="sempty">Type at least 3 letters…</div>'; return; }
  const hits = [];
  D.books.forEach((bk, bi) => {
    bk.secs.forEach((s, si) => {
      const hay = (s.sum + ' ' + s.b.map(x => x.t).join(' ')).toLowerCase();
      if (hay.includes(q)){
        const i = hay.indexOf(q);
        const ctx = hay.slice(Math.max(0, i - 70), i + 110).replace(/</g, '<');
        hits.push({ bi, si, bk, s, ctx });
      }
    });
  });
  if (!hits.length){ res.innerHTML = '<div class="sempty">No outline mentions “' + esc(q) + '”.</div>'; return; }
  res.innerHTML = hits.slice(0, 60).map((h, i) =>
    '<div class="sr" data-hi="' + i + '"><div class="srt">' + esc(h.bk.en) + ' · ' + esc(h.s.rng) + '</div>' +
    '<div class="srx">…' + ctxMark(h.ctx, q) + '…</div></div>').join('') +
    (hits.length > 60 ? '<div class="sempty">…and ' + (hits.length - 60) + ' more — keep typing to narrow down</div>' : '');
  $$('#sres .sr').forEach(r => r.onclick = () => {
    closeSbar();
    const h = hits[+r.dataset.hi];
    openBook(h.bi, h.s.ch[0] || 0);
  });
}
function ctxMark(ctx, q){
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  return esc(ctx).replace(re, m => '<mark>' + m + '</mark>');
}
function openSbar(){ $('#sbar').classList.add('on'); $('#sq').value = ''; $('#sres').innerHTML = '<div class="sempty">Search summaries and outline text across all 66 books.</div>'; setTimeout(() => $('#sq').focus(), 60); }
function closeSbar(){ $('#sbar').classList.remove('on'); }

/* ================= boot ================= */
function prepParts(){
  // assign each part to the position before the first section that follows it in the original doc
  D.books.forEach(bk => {
    // parts were collected in document order with their books; _before computed from section indices
    // (parser emitted parts in doc order per doc; we stored them per book)
    // approximate: spread evenly by matching range start to first covering section
    bk.parts.forEach(p => { p._before = 0; });
    if (!bk.parts.length) return;
    // use chapter info embedded in the part title like (1-11) or (EXODUS 1) to find insertion point
    bk.parts.forEach(p => {
      const m = p.t.match(/\(([^)]*)\)\s*$/);
      let startCh = 1;
      if (m){
        const nums = m[1].match(/(\d+)/g);
        if (nums) startCh = Math.max(1, parseInt(nums[0], 10));
      }
      let idx = bk.secs.findIndex(s => s.ch.some(c => c >= startCh));
      p._before = idx < 0 ? bk.secs.length : idx;
    });
    bk.parts.sort((a, b) => a._before - b._before);
  });
}

function boot(){
  loadSettings();
  loadEdits();
  if (SETTINGS.theme) document.documentElement.setAttribute('data-theme', SETTINGS.theme);
  applyIcon(SETTINGS.icon || 'scroll');
  prepParts();
  D.books.forEach(bk => bk.secs.forEach((s, si) => { s._ok = bk.os; s._si = si; }));
  updateEditCount();
  renderHome();
  $('#loader').remove();
  // restore last position
  try{
    const last = JSON.parse(localStorage.getItem('ob.last') || 'null');
    if (last && last.bi >= 0 && last.bi < D.books.length) openBook(last.bi, last.ch);
  }catch(e){}
}

/* events */
document.addEventListener('click', ev => {
  const m = $('#menu');
  if (m.classList.contains('on') && !ev.target.closest('#menu') && !ev.target.closest('#menubtn')) m.classList.remove('on');
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if ($('#sbar').classList.contains('on')){ closeSbar(); return; }
    if ($('#idlg').classList.contains('on')){ $('#idlg').classList.remove('on'); return; }
    if ($('#rdlg').classList.contains('on')){ PENDING = null; $('#rdlg').classList.remove('on'); return; }
    if ($('#cdlg').classList.contains('on')){ $('#cdlg').classList.remove('on'); return; }
    closeMenu();
  }
  if (e.key === '/' && document.activeElement !== $('#sq') && !$('#sbar').classList.contains('on')){ e.preventDefault(); openSbar(); }
});
function closeMenu(){ $('#menu').classList.remove('on'); }
$('#menubtn').onclick = ev => { ev.stopPropagation(); $('#menu').classList.toggle('on'); };
$('#m-install').onclick = () => { closeMenu(); openInstallDlg(); };
$('#idlgcancel').onclick = ev => { $('#idlg').classList.remove('on'); ev.currentTarget.blur(); };
$('#ibtn').onclick = async () => {
  if (deferredInstall){
    deferredInstall.prompt();
    try{ await deferredInstall.userChoice; }catch(e){}
    deferredInstall = null;
    $('#ibtn').style.display = 'none';
  } else {
    toast('Use your browser menu → Add to Home screen / Install app');
  }
};
$('#m-print').onclick = () => { closeMenu(); if (VIEW.book >= 0) setTimeout(() => window.print(), 60); else toast('Open a book first'); };
$('#m-backup').onclick = () => { closeMenu(); backupEdits(); };
$('#m-restore').onclick = () => { closeMenu(); restoreEdits(); };
$('#m-clear').onclick = () => {
  closeMenu();
  if (!Object.keys(EDITS).length){ toast('No edits to clear'); return; }
  $('#cdlginfo').innerHTML = 'This removes all <b>' + Object.keys(EDITS).length + '</b> edit' + (Object.keys(EDITS).length === 1 ? '' : 's') + ' and restores the original translated text.<br>Back them up first if you might want them.';
  $('#cdlg').classList.add('on');
};
$('#cdlgcancel').onclick = () => { $('#cdlg').classList.remove('on'); };
$('#cdlgok').onclick = () => {
  $('#cdlg').classList.remove('on');
  EDITS = {}; saveEdits(); updateEditCount(); refreshView();
  toast('All edits cleared — original text restored');
};
$('#rdlgcancel').onclick = () => { PENDING = null; $('#rdlg').classList.remove('on'); };
$('#rdlgreplace').onclick = () => { $('#rdlg').classList.remove('on'); applyPending('replace'); };
$('#rdlgmerge').onclick = () => { $('#rdlg').classList.remove('on'); applyPending('merge'); };
$('#rfile').onchange = async ev => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (f) handleRestoreFile(f);
};
$('#m-about').onclick = () => {
  closeMenu();
  toast(D.meta.title + ' · ' + D.meta.author + ' · ' + D.meta.license + ' — for personal & ministry use', 5200);
};
$('#themebtn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme') === 'dark' ? '' : 'dark';
  document.documentElement.setAttribute('data-theme', cur);
  SETTINGS.theme = cur; saveSettings();
};
$('#searchbtn').onclick = openSbar;
$('#sclose').onclick = closeSbar;
$('#brand').onclick = () => { VIEW.book = -1; $('#book').style.display = 'none'; $('#home').style.display = 'block'; window.scrollTo(0, 0); };
let sqT = null;
$('#sq').addEventListener('input', () => { clearTimeout(sqT); sqT = setTimeout(() => runSearch($('#sq').value), 200); });

/* test api */
window.__wo = {
  get D(){ return D; },
  get view(){ return VIEW; },
  openBook, sectionsForChapter, runSearch, prepParts,
  get edits(){ return EDITS; },
  setEdits(o){ EDITS = Object.assign({}, o); saveEdits(); updateEditCount(); refreshView(); },
  backupPayload, applyPending, handleRestoreFile
};

loadData().then(boot).catch(err => {
  console.error(err);
  const l = $('#loader');
  if (l) l.innerHTML = '<div style="font-family:var(--font-ui); color:var(--accent)">Could not load the outline data.<br>' + String(err).slice(0, 120) + '</div>';
});
</script>
